name: Backend CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UrbanIssue.slnx

      - name: Build
        run: dotnet build UrbanIssue.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UrbanIssue.slnx --configuration Release --no-build --verbosity normal
